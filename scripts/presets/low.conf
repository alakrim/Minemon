# Minemon fallback preset for slow machines (same keys as vega8.conf, minus shadows and bloom).
# Use it when the fps is below 30: close the game, then replace minetest.conf with this file.
# Every key here is listed in Luanti 5.17.0 builtin/settingtypes.txt (scripts/build_windows.sh checks this).

# Shorter draw distance (80 nodes): the biggest saving on a weak GPU.
viewing_range = 80

# Fog hides the far edge of the view range.
enable_fog = true

# Dynamic shadows off (not in this preset).
enable_dynamic_shadows = false

# Post-processing stays on: FXAA and auto exposure below need it. It is cheap at this level.
enable_post_processing = true
# Bloom off (not in this preset).
enable_bloom = false
# Automatic exposure: brightness follows the scene. Small cost.
enable_auto_exposure = true
# Volumetric light (godrays) off: too expensive for a Vega 8.
enable_volumetric_lighting = false

# FXAA: the cheapest real anti-aliasing, one post pass.
fxaa = true
# Full-scene antialiasing multiplies the GPU work, so it stays off.
antialiasing = none

# Waving leaves, plants and water: small vertex cost.
enable_waving_leaves = true
enable_waving_plants = true
enable_waving_water = true

# Mipmaps stop distant textures from shimmering; they cost little memory.
mip_map = true
# Anisotropic filtering keeps ground and paths sharp at a viewing angle.
anisotropic_filter = true

# Smooth lighting: softer shading on block edges for very little cost.
smooth_lighting = true

# Cap the frame rate at 60; uncapped rates waste power and heat on a laptop iGPU.
fps_max = 60
# VSync off: it adds input lag and can halve the fps when a frame is late.
vsync = false
